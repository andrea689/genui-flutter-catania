name: genui_flutter_catania
description: "Etna Assistant — demo GenUI per il talk a Flutter Catania."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # GenUI. Versione pinnata senza caret: il package e' in alpha e l'API e'
  # cambiata a maggio 2026 (`ContentGenerator` non esiste piu').
  genui: 0.10.3
  json_schema_builder: ^0.1.7

  # Firebase AI Logic + App Check (obbligatorio dal 2 novembre 2026).
  firebase_core: ^4.15.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8

  # Stato.
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # Dominio.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  http: ^1.6.0

  # Mappa degli epicentri.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen. I *.g.dart e *.freezed.dart NON sono nel repo: dopo il clone
  # serve `fvm dart run build_runner build` prima di qualsiasi altra cosa.
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.1

  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
